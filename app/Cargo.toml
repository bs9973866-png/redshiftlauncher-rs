[package]
name = "redshift-launcher"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
redshift-core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"
