[package]
name = "redshift-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
hex = "0.4"
thiserror = "1"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
